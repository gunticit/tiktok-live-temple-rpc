<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="25%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="75%" stop-color="#ff8f00" />
      <stop offset="100%" stop-color="#ff6f00" />
    </linearGradient>

    <linearGradient id="silverMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cfd8dc" />
      <stop offset="100%" stop-color="#90a4ae" />
    </linearGradient>

    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2b45" />
      <stop offset="100%" stop-color="#05121e" />
    </linearGradient>

    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1976d2" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ffb300" flood-opacity="0.45" />
    </filter>
    <filter id="bevelDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- CHECKERED FLAGS BEHIND -->
  <g transform="translate(300, 48)" filter="url(#bevelDrop)">
    <!-- Left Flag -->
    <path d="M 0,0 L -90,-25 L -80,15 L 0,25 Z" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />
    <path d="M -45,-12 L -90,-25 L -85,-5 L -40,8 Z" fill="#ffffff" />
    <path d="M 0,12 L -40,8 L -40,20 L 0,25 Z" fill="#ffffff" />
    <!-- Right Flag -->
    <path d="M 0,0 L 90,-25 L 80,15 L 0,25 Z" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />
    <path d="M 45,-12 L 90,-25 L 85,-5 L 40,8 Z" fill="#ffffff" />
    <path d="M 0,12 L 40,8 L 40,20 L 0,25 Z" fill="#ffffff" />
  </g>

  <!-- GOLDEN WINGS SPREAD LEFT & RIGHT -->
  <g filter="url(#logoGlow)">
    <!-- Left Wing Feathers -->
    <path d="M 230,80 Q 150,50 80,55 Q 120,85 180,95 Q 110,95 70,110 Q 130,120 200,118 Q 120,130 90,145 Q 160,145 220,135 Z" fill="url(#goldMetallic)" stroke="#e65100" stroke-width="2" />
    <!-- Right Wing Feathers -->
    <path d="M 370,80 Q 450,50 520,55 Q 480,85 420,95 Q 490,95 530,110 Q 470,120 400,118 Q 480,130 510,145 Q 440,145 380,135 Z" fill="url(#goldMetallic)" stroke="#e65100" stroke-width="2" />
  </g>

  <!-- CENTRAL CREST SHIELD -->
  <g filter="url(#bevelDrop)">
    <polygon points="300,15 390,30 380,145 300,185 220,145 210,30" fill="url(#shieldNavy)" stroke="url(#goldMetallic)" stroke-width="5" />
  </g>

  <!-- GOLD STEERING WHEEL ON TOP -->
  <g transform="translate(300, 48)" filter="url(#bevelDrop)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldMetallic)" stroke-width="7" />
    <!-- Inner Hub -->
    <circle cx="0" cy="0" r="10" fill="url(#goldMetallic)" />
    <!-- 3 Spokes -->
    <line x1="0" y1="0" x2="0" y2="28" stroke="url(#goldMetallic)" stroke-width="5" />
    <line x1="0" y1="0" x2="-24" y2="-14" stroke="url(#goldMetallic)" stroke-width="5" />
    <line x1="0" y1="0" x2="24" y2="-14" stroke="url(#goldMetallic)" stroke-width="5" />
  </g>

  <!-- TITLE: ĐẤU TRƯỜNG -->
  <g filter="url(#bevelDrop)">
    <text x="300" y="88" font-family="'Montserrat', 'Be Vietnam Pro', sans-serif" font-weight="900" font-size="28" fill="#ffffff" stroke="#003366" stroke-width="2" text-anchor="middle" letter-spacing="4">
      ĐẤU TRƯỜNG
    </text>
  </g>

  <!-- MAIN TITLE: GPLX (LARGE 3D GOLD) -->
  <g filter="url(#bevelDrop)">
    <text x="300" y="142" font-family="'Montserrat', sans-serif" font-weight="900" font-size="62" fill="url(#goldMetallic)" stroke="#3e2723" stroke-width="4" text-anchor="middle" letter-spacing="3">
      GPLX
    </text>
  </g>

  <!-- SUBTITLE BANNER RIBBON: HẠNG B - C1 - C -->
  <g filter="url(#bevelDrop)">
    <!-- Ribbon Base -->
    <polygon points="190,155 410,155 400,185 300,192 200,185" fill="url(#blueRibbon)" stroke="url(#goldMetallic)" stroke-width="2.5" />
    <text x="300" y="177" font-family="'Montserrat', 'Be Vietnam Pro', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      HẠNG B - C1 - C
    </text>
  </g>
</svg>
