<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="heartAura" cx="54%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#ff2d75" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff2d75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartRed" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff85a2"/>
      <stop offset="45%" stop-color="#fe2c55"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe0bd"/>
      <stop offset="65%" stop-color="#f7b98c"/>
      <stop offset="100%" stop-color="#d98a5f"/>
    </linearGradient>
    <filter id="fhShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <circle cx="68" cy="38" r="44" fill="url(#heartAura)"/>
  <g filter="url(#fhShadow)">
    <!-- Floating Glossy Heart -->
    <path d="M68 54 C68 54, 44 39, 44 24 C44 15, 51 10, 58 10 C63 10, 66 13, 68 17 C70 13, 73 10, 78 10 C85 10, 92 15, 92 24 C92 39, 68 54, 68 54 Z" fill="url(#heartRed)" stroke="#ffd1dc" stroke-width="2"/>
    <ellipse cx="55" cy="21" rx="4.5" ry="7" transform="rotate(-25 55 21)" fill="#fff" opacity="0.45"/>
    <!-- Finger Heart Hand -->
    <!-- Palm & Wrist -->
    <path d="M40 84 C36 96, 42 114, 58 118 L76 118 C90 115, 96 100, 92 84 C88 70, 78 64, 64 64 C50 64, 43 72, 40 84 Z" fill="url(#skinTone)" stroke="#b46a44" stroke-width="2"/>
