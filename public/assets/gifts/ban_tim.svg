    <rect x="74" y="75" width="18" height="11" rx="5.5" fill="#f3ad7d" stroke="#b46a44" stroke-width="1.6"/>
    <rect x="76" y="86" width="17" height="10" rx="5" fill="#eba06f" stroke="#b46a44" stroke-width="1.6"/>
    <rect x="74" y="96" width="15" height="9" rx="4.5" fill="#e19160" stroke="#b46a44" stroke-width="1.6"/>
    <!-- Index Finger -->
    <path d="M52 72 L58 52 C60 47, 68 48, 68 55 L65 76 Z" fill="url(#skinTone)" stroke="#b46a44" stroke-width="1.8"/>
    <!-- Crossed Thumb -->
    <path d="M43 84 C43 72, 54 61, 66 57 C72 55, 76 62, 70 68 L55 86 Z" fill="url(#skinTone)" stroke="#b46a44" stroke-width="1.8"/>
    <!-- Sparkles -->
    <path d="M32 22 L34 27 L39 29 L34 31 L32 36 L30 31 L25 29 L30 27 Z" fill="#fef08a"/>
    <path d="M100 32 L102 36 L106 38 L102 40 L100 44 L98 40 L94 38 L98 36 Z" fill="#fbcfe8"/>
