<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="roseGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#ff4d79" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalOuter" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="petalInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9eb5"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="stemGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="roseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <circle cx="64" cy="54" r="52" fill="url(#roseGlow)"/>
  <g filter="url(#roseShadow)">
    <!-- Stem -->
    <path d="M64 74 C63 92, 60 105, 54 118" stroke="url(#stemGreen)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Left Leaf -->
    <path d="M59 95 C41 88, 30 92, 26 104 C38 108, 52 105, 59 95 Z" fill="url(#stemGreen)" stroke="#86efac" stroke-width="1.5"/>
    <!-- Right Leaf -->
    <path d="M62 88 C80 78, 95 82, 100 94 C86 100, 72 97, 62 88 Z" fill="url(#stemGreen)" stroke="#86efac" stroke-width="1.5"/>
    <!-- Calyx -->
    <path d="M48 70 Q64 84 80 70 Q70 78 64 82 Q58 78 48 70 Z" fill="#16a34a"/>
    <!-- Outer Petals -->
    <path d="M64 20 C42 20, 28 38, 34 58 C40 74, 54 78, 64 78 C74 78, 88 74, 94 58 C100 38, 86 20, 64 20 Z" fill="url(#petalOuter)"/>
    <path d="M36 42 C24 46, 26 66, 44 73 C50 64, 48 50, 36 42 Z" fill="url(#petalInner)"/>
    <path d="M92 42 C104 46, 102 66, 84 73 C78 64, 80 50, 92 42 Z" fill="url(#petalInner)"/>
    <!-- Inner Swirl Petals -->
    <path d="M64 24 C50 24, 42 36, 46 50 C50 62, 60 66, 68 64 C78 62, 84 52, 82 40 C80 28, 72 24, 64 24 Z" fill="url(#petalInner)" stroke="#fda4af" stroke-width="1.4"/>
    <path d="M52 38 C52 29, 64 26, 72 32 C79 38, 76 50, 66 52 C56 54, 51 46, 56 39 C60 34, 68 35, 68 41 C68 45, 63 46, 61 43" fill="none" stroke="#ffe4e6" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Glossy Sparkle -->
    <ellipse cx="48" cy="36" rx="5" ry="9" transform="rotate(-25 48 36)" fill="#ffffff" opacity="0.35"/>
    <path d="M94 24 L97 31 L104 34 L97 37 L94 44 L91 37 L84 34 L91 31 Z" fill="#fff1f2"/>
  </g>
</svg>
